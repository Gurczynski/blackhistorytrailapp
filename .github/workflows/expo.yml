name: Expo Publish

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install deps
        run: npm install

      - name: Publish OTA Update
        run: npx eas update --branch production --message "Auto-publish from GitHub Actions [${GITHUB_SHA::7}]"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
