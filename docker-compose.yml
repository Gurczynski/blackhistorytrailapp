services:
  expo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: black-history-trail-expo
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "19000:19000"  # Expo DevTools and web interface
      - "19001:19001"  # iOS development
      - "19006:19006"  # Android development
    environment:
      - NODE_ENV=development
    stdin_open: true
    tty: true
    command: ["npm", "start"]
    networks:
      - expo-network

networks:
  expo-network:
    driver: bridge
